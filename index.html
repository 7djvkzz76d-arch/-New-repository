<!doctype html>
<html lang="zh-CN">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1697827837177436" crossorigin="anonymous"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>躲避！ Dodge V4</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#05070b">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#070b16;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{position:relative;width:min(100vw,520px);height:100vh;margin:auto;overflow:hidden;background:radial-gradient(circle at 50% 18%,#243c72,#080b14 68%)}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.pill{padding:7px 10px;border:1px solid #fff2;border-radius:13px;background:#ffffff12;backdrop-filter:blur(10px);font-size:12px}.pill b{font-size:16px}.bar{position:absolute;top:59px;left:12px;right:12px;height:5px;background:#fff2;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#fff;border-radius:9px}.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:#050812aa;backdrop-filter:blur(6px);z-index:5}.card{width:min(92%,410px);background:#10182b;border:1px solid #fff2;border-radius:24px;padding:24px;box-shadow:0 25px 80px #0009;text-align:center}h1{margin:0 0 5px;font-size:42px}h2{margin:0 0 10px}p{opacity:.78;line-height:1.5}.row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:16px}button{border:0;border-radius:14px;padding:12px 17px;font-size:16px;font-weight:800;cursor:pointer;background:#fff;color:#08101f}button.alt{background:#ffffff16;color:#fff;border:1px solid #fff2}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.skin{padding:12px 5px;border-radius:13px;background:#ffffff0e;border:1px solid #fff1;cursor:pointer}.skin.lock{opacity:.45}.dot{width:28px;height:28px;border-radius:50%;margin:auto auto 6px;background:#fff;box-shadow:0 0 16px #fff}.card input::placeholder{color:#fff8}.small{font-size:11px;opacity:.5;margin-top:12px}.hidden{display:none}#toast{position:absolute;left:50%;top:75px;transform:translateX(-50%);padding:8px 12px;background:#111a2de8;border:1px solid #fff2;border-radius:12px;opacity:0;transition:.2s;z-index:8;pointer-events:none}
</style></head>
<body><div id="app"><canvas id="c"></canvas><div class="hud"><div class="pill">分数 <b id="score">0</b> · <span id="level">Lv.1</span></div><div class="pill">🪙 <b id="coins">0</b>　🏆 <b id="best">0</b></div></div><div class="bar"><i id="xp"></i></div><div id="toast"></div>
<div id="home" class="screen"><div class="card"><h1>躲避！</h1><p>V4 排行榜版 · 躲开障碍，挑战更高分。</p><div class="row"><button id="play">开始游戏</button><button class="alt" id="shop">皮肤商店</button><button class="alt" id="leaderboardBtn">🏆 排行榜</button></div><p class="small">支持手机拖动、电脑鼠标、方向键 / WASD</p></div></div>
<div id="shopScreen" class="screen hidden"><div class="card"><h2>🛍️ 皮肤商店</h2><p>选择你喜欢的球。金币保存在本机。</p><div id="skins" class="grid"></div><div class="row"><button class="alt" id="back">返回</button></div></div></div>
<div id="leaderboardScreen" class="screen hidden"><div class="card"><h2>🏆 本地排行榜</h2><p>本排行榜保存在这台设备的浏览器中。</p><div id="leaderboard" style="margin-top:14px;text-align:left"></div><div class="row"><button class="alt" id="clearLeaderboard">清空记录</button><button class="alt" id="leaderboardBack">返回</button></div><p class="small">以后可以升级成真正的在线排行榜，让所有玩家一起竞争。</p></div></div>
<div id="over" class="screen hidden"><div class="card"><h2>游戏结束</h2><p>本局 <b id="finalScore">0</b>　最高 <b id="finalBest">0</b><br>获得金币 <b id="earned">0</b></p><div class="row"><input id="playerName" maxlength="12" placeholder="输入昵称" value="玩家" style="width:150px;padding:12px;border-radius:14px;border:1px solid #fff2;background:#ffffff0e;color:#fff;font-size:16px;text-align:center"><button id="saveScore">保存成绩</button></div><div class="row"><button id="revive">🎬 观看广告复活</button><button id="again">再来一次</button><button class="alt" id="homeBtn">主菜单</button></div><p id="reviveHint" class="small">广告功能演示版：以后接入 Google 激励广告后，观看完整广告即可复活。</p></div></div>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),app=document.getElementById('app');let W=0,H=0,dpr=1,last=0,running=false,score=0,level=1,spawnTimer=0,speed=220,coins=+localStorage.dodgeCoinsV2||0,best=+localStorage.dodgeBestV2||0,earned=0,reviveUsed=false;const owned=JSON.parse(localStorage.dodgeSkins||'["white"]');let selected=localStorage.dodgeSkin||'white';const skins=[{id:'white',name:'经典',cost:0,color:'#fff'},{id:'cyan',name:'霓虹',cost:40,color:'#64f7ff'},{id:'gold',name:'黄金',cost:120,color:'#ffd45c'},{id:'violet',name:'紫电',cost:220,color:'#c58cff'},{id:'lime',name:'能量',cost:350,color:'#b9ff63'},{id:'rose',name:'玫瑰',cost:500,color:'#ff7fa8'}];let p={x:0,y:0,r:13},obs=[],particles=[],keys={};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=app.clientWidth;H=app.clientHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);p.x=W/2;p.y=H*.78}addEventListener('resize',resize);resize();function save(){localStorage.dodgeCoinsV2=coins;localStorage.dodgeBestV2=best;localStorage.dodgeSkins=JSON.stringify(owned);localStorage.dodgeSkin=selected}const scoreEl=document.getElementById('score'),coinsEl=document.getElementById('coins'),bestEl=document.getElementById('best');function ui(){scoreEl.textContent=Math.floor(score);coinsEl.textContent=coins;bestEl.textContent=best;level=Math.floor(score/120)+1;document.getElementById('level').textContent='Lv.'+level;document.getElementById('xp').style.width=((score%120)/120*100)+'%'}function show(id){['home','shopScreen','leaderboardScreen','over'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id))}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,900)}function renderShop(){const box=document.getElementById('skins');box.innerHTML='';skins.forEach(s=>{const d=document.createElement('div');d.className='skin'+(owned.includes(s.id)?'':' lock');d.innerHTML=`<div class="dot" style="background:${s.color}"></div><b>${s.name}</b><div>${owned.includes(s.id)?'已拥有':s.cost+' 🪙'}</div>`;d.onclick=()=>{if(owned.includes(s.id)){selected=s.id;save();toast('已装备：'+s.name);renderShop()}else if(coins>=s.cost){coins-=s.cost;owned.push(s.id);selected=s.id;save();toast('解锁成功！');renderShop()}else toast('金币不够')};box.appendChild(d)})}
const leaderboardKey='dodgeLeaderboardV1';
function getLeaderboard(){try{const v=JSON.parse(localStorage.getItem(leaderboardKey)||'[]');return Array.isArray(v)?v:[]}catch(e){return []}}
function saveLeaderboard(list){localStorage.setItem(leaderboardKey,JSON.stringify(list.slice(0,10)))}
function renderLeaderboard(){const box=document.getElementById('leaderboard');const list=getLeaderboard();if(!list.length){box.innerHTML='<div style="padding:18px;border-radius:14px;background:#ffffff0e;text-align:center;opacity:.65">还没有成绩，快去挑战第一名！</div>';return}box.innerHTML=list.map((x,i)=>`<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;margin:6px 0;border-radius:13px;background:${i===0?'#ffd45c18':'#ffffff0e'}"><b style="width:28px">${i+1}</b><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(x.name)}</span><b>${x.score}</b></div>`).join('')}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[m]))}
function submitScore(){const input=document.getElementById('playerName');let name=(input.value||'玩家').trim().slice(0,12)||'玩家';const value=Math.floor(score);const list=getLeaderboard();list.push({name,score:value,time:Date.now()});list.sort((a,b)=>b.score-a.score||a.time-b.time);saveLeaderboard(list);input.value=name;toast('🏆 成绩已保存！');renderLeaderboard()}
function reset(){score=0;level=1;speed=220;spawnTimer=.3;earned=0;obs=[];particles=[];reviveUsed=false;p.x=W/2;p.y=H*.78;ui()}function play(){reset();running=true;show('none');last=performance.now();requestAnimationFrame(loop)}
function end(){running=false;best=Math.max(best,Math.floor(score));save();document.getElementById('finalScore').textContent=Math.floor(score);document.getElementById('finalBest').textContent=best;document.getElementById('earned').textContent=earned;document.getElementById('revive').classList.toggle('hidden',reviveUsed);document.getElementById('reviveHint').textContent=reviveUsed?'本局复活机会已使用。':'广告功能演示版：以后接入 Google 激励广告后，观看完整广告即可复活。';show('over')}
function revive(){if(reviveUsed)return;reviveUsed=true;document.getElementById('revive').classList.add('hidden');document.getElementById('reviveHint').textContent='广告播放中…';toast('🎬 广告演示中');setTimeout(()=>{obs=[];particles=[];p.x=W/2;p.y=H*.78;score+=25;speed=Math.max(220,speed*.9);running=true;show('none');last=performance.now();toast('❤️ 复活成功！');requestAnimationFrame(loop)},1200)}
function move(x,y){p.x=Math.max(p.r,Math.min(W-p.r,x));p.y=Math.max(82,Math.min(H-p.r,y))}c.addEventListener('pointermove',e=>{if(running){const r=c.getBoundingClientRect();move(e.clientX-r.left,e.clientY-r.top)}});c.addEventListener('pointerdown',e=>{if(running){const r=c.getBoundingClientRect();move(e.clientX-r.left,e.clientY-r.top)}});addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '&&!running)play()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function spawnObstacle(){const size=18+Math.random()*34;obs.push({x:size/2+Math.random()*(W-size),y:-size,size,vy:speed*(.72+Math.random()*.55),rot:Math.random()*6.28,vr:(Math.random()-.5)*3})}function particle(x,y,n=10,color='#fff'){
for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*260,vy:(Math.random()-.5)*260,life:.45+Math.random()*.65,max:.45+Math.random()*.65,size:2+Math.random()*4,color});
}function collide(o){const dx=Math.abs(p.x-o.x),dy=Math.abs(p.y-(o.y+o.size/2));return dx<p.r+o.size/2&&dy<p.r+o.size/2}
function draw(t){ctx.clearRect(0,0,W,H);
    // V3 visual polish: subtle arena glow and speed lines
    const g=ctx.createRadialGradient(p.x,p.y,10,W/2,H*.55,Math.max(W,H)*.8);
    g.addColorStop(0,'rgba(100,247,255,.07)');g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<55;i++){let x=(i*83)%W,y=((i*137+t*.015)%H);ctx.globalAlpha=.12;ctx.fillStyle='#fff';ctx.fillRect(x,y,1.5,1.5)}ctx.globalAlpha=1;for(const o of obs){ctx.save();ctx.translate(o.x,o.y+o.size/2);ctx.rotate(o.rot);ctx.fillStyle='#ff5367';ctx.shadowBlur=18;ctx.shadowColor='#ff536788';ctx.fillRect(-o.size/2,-o.size/2,o.size,o.size);ctx.restore()}const s=skins.find(x=>x.id===selected)||skins[0];ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fillStyle=s.color;ctx.shadowBlur=24;ctx.shadowColor=s.color;ctx.fill();
ctx.beginPath();ctx.arc(p.x,p.y,p.r+7+Math.sin(t*.006)*2,0,7);
ctx.strokeStyle=s.color;ctx.globalAlpha=.22;ctx.lineWidth=2;ctx.stroke();
ctx.shadowBlur=0;ctx.globalAlpha=1;
for(const q of particles){
ctx.globalAlpha=Math.max(0,q.life/(q.max||1));
ctx.fillStyle=q.color||'#fff';
ctx.shadowBlur=10;ctx.shadowColor=q.color||'#fff';
ctx.fillRect(q.x,q.y,q.size||3,q.size||3);
}
ctx.shadowBlur=0;ctx.globalAlpha=1}
function loop(t){if(!running)return;const dt=Math.min((t-last)/1000,.035);last=t;if(keys.arrowleft||keys.a)p.x-=370*dt;if(keys.arrowright||keys.d)p.x+=370*dt;if(keys.arrowup||keys.w)p.y-=370*dt;if(keys.arrowdown||keys.s)p.y+=370*dt;move(p.x,p.y);score+=dt*10;speed+=dt*3.2;ui();spawnTimer-=dt;if(spawnTimer<=0){spawnObstacle();spawnTimer=Math.max(.16,.68-score/850)}for(let i=obs.length-1;i>=0;i--){let o=obs[i];o.y+=o.vy*dt;o.rot+=o.vr*dt;if(collide(o)){particle(p.x,p.y,34,'#ff5367');particle(p.x,p.y,14,'#fff');end();return}if(o.y>H+60){
obs.splice(i,1);earned++;
if(earned%3===0){coins++;particle(p.x,Math.min(H-100,p.y-30),8,'#ffd45c');toast('🪙 +1 金币');}
}}for(let i=particles.length-1;i>=0;i--){let q=particles[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.96;q.vy*=.96;q.life-=dt;if(q.life<=0)particles.splice(i,1)}draw(t);requestAnimationFrame(loop)}
document.getElementById('play').onclick=play;document.getElementById('again').onclick=play;document.getElementById('revive').onclick=revive;document.getElementById('homeBtn').onclick=()=>show('home');document.getElementById('shop').onclick=()=>{renderShop();show('shopScreen')};document.getElementById('back').onclick=()=>show('home');document.getElementById('leaderboardBtn').onclick=()=>{renderLeaderboard();show('leaderboardScreen')};document.getElementById('leaderboardBack').onclick=()=>show('home');document.getElementById('saveScore').onclick=submitScore;document.getElementById('clearLeaderboard').onclick=()=>{if(confirm('确定清空本机排行榜吗？')){localStorage.removeItem(leaderboardKey);renderLeaderboard();toast('排行榜已清空')}};ui();draw(0);
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js');});}</script>
</body></html>
